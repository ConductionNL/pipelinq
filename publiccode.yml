description:
  en:
    shortDescription: >
      CRM and sales pipeline management for Nextcloud.
    longDescription: >
      Pipelinq is a CRM and sales pipeline management application for Nextcloud.
      It enables organisations to manage leads, contacts, opportunities, and sales
      processes within Nextcloud. Built on Open Register, it integrates with
      Nextcloud's ecosystem and provides a structured approach to managing customer
      relationships and sales workflows suitable for both government and commercial
      organisations.
      Conduction maintains this component within the Nextcloud ISV programme.
      Pipelinq is available in the Nextcloud App Store at
      https://apps.nextcloud.com/apps/pipelinq.
    features:
      - Client management for persons and organisations with contact details, notes and history
      - Contact persons linked to organisations with roles
      - Lead pipeline on a drag-and-drop kanban board with configurable stages
      - Request intake before requests become formal cases
      - Contact moments for calls, emails, visits and other interactions
      - My Work queue with assigned leads, requests and follow-ups
      - Two-way sync with Nextcloud Contacts via CardDAV
      - Duplicate detection through OpenRegister master data management
      - vCard import and export plus scheduled CSV data exports
      - Activity and notifications on assignments, stage changes and new notes
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-pipeline.png
      - img/screenshot-clients.png

  nl:
    shortDescription: >
      CRM en verkooppipelinebeheer voor Nextcloud.
    longDescription: >
      Pipelinq is een CRM- en verkooppipelinebeheertoepassing voor Nextcloud.
      Het stelt organisaties in staat om leads, contacten, kansen en verkoopprocessen
      te beheren binnen Nextcloud. Gebouwd op Open Register integreert het met het
      Nextcloud-ecosysteem en biedt een gestructureerde aanpak voor het beheren van
      klantrelaties en verkoopworkflows, geschikt voor zowel overheids- als
      commerciële organisaties.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
      Pipelinq is beschikbaar in de Nextcloud App Store via
      https://apps.nextcloud.com/apps/pipelinq.
    features:
      - Klantbeheer voor personen en organisaties met contactgegevens, notities en historie
      - Contactpersonen gekoppeld aan organisaties met rollen
      - Lead-pipeline op een drag-and-drop kanbanbord met configureerbare fases
      - Verzoekintake voordat verzoeken formele zaken worden
      - Contactmomenten voor telefoongesprekken, e-mails, bezoeken en andere interacties
      - Mijn Werk met toegewezen leads, verzoeken en opvolgingen
      - Tweerichtingssynchronisatie met Nextcloud Contacten via CardDAV
      - Duplicaatdetectie via master-data management in OpenRegister
      - vCard-import en -export plus geplande CSV-data-exports
      - Activiteit en notificaties bij toewijzingen, fasewijzigingen en nieuwe notities
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-pipeline.png
      - img/screenshot-clients.png

