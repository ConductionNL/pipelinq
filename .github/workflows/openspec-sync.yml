name: OpenSpec Sync

on:
  push:
    branches: [development]
    paths: ['openspec/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      issues: write
      contents: read
    uses: ConductionNL/.github/.github/workflows/openspec-sync.yml@main
    with:
      app-name: pipelinq
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
