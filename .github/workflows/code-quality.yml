name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    # `synchronize` — a push to an open PR — was missing. Without it the quality
    # suite runs ONCE, when the PR is opened, and every commit after that merges
    # unchecked while the PR still shows the first run's green tick. A green
    # check here described code that no longer existed. opencatalogi and
    # openregister fixed the identical defect on their copies of this workflow.
    types: [opened, reopened, synchronize]
    branches: [main, beta, development]
  workflow_dispatch:
  # Weekly smoke-test cron (pipelinq-quality-phpstan-burndown, Phase 5). A
  # scheduled run always uses the default branch's workflow file and ref
  # (development), so this re-runs the full strict gate suite — phpcs, phpmd,
  # psalm, phpstan (composer check:strict equivalent) plus phpunit — against
  # development once a week to catch drift between PRs. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write).
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    # A branch's FIRST push carries `github.event.created == true` and is
    # skipped entirely by this guard — without it, that push looks like CI ran
    # when it ran nothing at all.
    if: github.event_name != 'push' || github.event.created != true
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: pipelinq
      # Strict static-analysis gate suite (composer check:strict equivalent).
      # These mirror the shared-workflow defaults (all true) but are pinned
      # here explicitly so the strict-gate posture is self-documenting and
      # cannot regress silently if the shared defaults ever change.
      enable-phpcs: true
      enable-phpmd: true
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-sbom: true
      # Run the Hydra mechanical quality gates against this PR's diff.
      #
      # This tier has never executed in this repository. `enable-hydra-gates`
      # defaults to false, so `quality / Hydra Gates` has been SKIPPED on every
      # run here — and a skipped job is neither a pass nor a failure in the
      # Quality Report rollup, so its absence has been indistinguishable from
      # its success.
      #
      # Measured before switching on, not assumed. Running the v1.0.1 package
      # locally against this repo's most recent merged PR diff reported ALL
      # GATES PASSED (58 of 61 reporting; 4, 24 and 33 have no prerequisite
      # here). The whole-tree audit does show 8 gate-61 (listener-work-placement)
      # registrations carrying inherited debt — that is a real work-list, but
      # gate-61 is diff-scoped in both full and scoped runs, so it reports zero
      # on untouched trees and will not block unrelated PRs.
      #
      # No count is written here on purpose: the number of gates depends on the
      # pin below and the number that run depends on this repo's diff and
      # toolchain. The package prints both (`COVERAGE: N of M`) in the job log.
      # See https://github.com/ConductionNL/.github/tree/main/hydra-gates
      #
      # Pinned to a tag, not `main`, so a change to the gate package cannot
      # alter this repository's verdict without a commit here to move the pin.
      # v1.0.1 is the pin openbuild and openregister already run.
      #
      # v1.0.1 -> v1.3.0 (ConductionNL/.github#159). Two defects, one bump.
      #
      # 1. STALE. v1.0.1 is `f4d9756` (2026-08-03) and predates three gate
      #    fixes, so every Hydra Gates run this repo has ever made executed a
      #    script in which 16 gates reported PASS when their helper never ran
      #    (#147), gate-33 had no axe report to read and never said so (#148),
      #    and gates 6 and 7 reported PASS on an EMPTY scope (#149). A gate
      #    that reports PASS without running emits a tick identical to a real
      #    one, which is why nothing in this repo's history shows it.
      #
      # 2. RED. quality.yml is referenced `@main` while this package is
      #    PINNED, so the two can desync — and on 2026-08-05 they did. #164
      #    flipped `hydra-gates-require-full-coverage` to default TRUE, but
      #    the accounting that makes that flag survivable (NOT APPLICABLE, as
      #    distinct from a structural or a wiring gap) ships in the PACKAGE.
      #    So every pin older than `f7eaf2a` now fails the coverage assertion
      #    for gates it has no subject matter for. Measured diff-scoped,
      #    exactly as CI scopes it:
      #      v1.0.1  exit 98  FAIL — "GATES THAT DID NOT RUN: 24 33"
      #      v1.3.0  exit 0   PASS — those gates named NOT APPLICABLE
      #    The old pin was not merely stale, it was failing this repo's CI for
      #    a reason that had nothing to do with this repo — and it is what is
      #    currently blocking #707 and #704.
      #
      # v1.3.0 is `f7eaf2a` = .github@main, tagged so the ref stays
      # reproducible and a later gate change cannot move this repo's verdict
      # without a commit here.
      enable-hydra-gates: true
      hydra-gates-ref: v1.3.0
      # `enable-axe` deliberately NOT set: it produces the report gate-33
      # consumes, and a vanilla Nextcloud already carries serious/critical axe
      # violations, so enabling it here would mix "this repo has a defect" with
      # "core does". Separate change. gate-33 reports SKIPPED meanwhile.
      enable-phpunit: true
      # Newman: tests/newman/pipelinq-api.postman_collection.json doesn't pass
      # against a freshly-installed NC yet — the CRM endpoints need the
      # OpenRegister registers/schemas seeded (the disable/enable repair cycle
      # alone isn't enough). Re-enable once the collection has a working seed
      # path. PHPUnit (the unit suite) runs and is green.
      enable-newman: false
      newman-collection-path: "tests/newman"
      # ── E2E browser tests ────────────────────────────────────────────────
      # `playwright-test-path` does double duty in the shared workflow:
      #   1. it is the directory the "Validate Playwright tests exist" step
      #      counts *.spec.ts in;
      #   2. it is the FIRST place the run step looks for a config —
      #      `${playwright-test-path}/playwright.config.ts`, falling back to
      #      the repo root only if that file is absent.
      # We ship tests/e2e/playwright.config.ts precisely so lookup (2) hits it.
      # The run step passes no `--project`, so the root config would run all
      # THREE of its projects — including `visual` (pixel baselines whose own
      # header says a CI Linux runner cannot byte-match them) and `docs-capture`
      # (screenshot re-shoots, which have their own dedicated job). The
      # tests/e2e config declares only the regression project, and writes its
      # report to the app root where the upload step actually looks.
      enable-playwright: true
      playwright-test-path: tests/e2e
      enable-playwright-coverage: true
      playwright-coverage-threshold: 75
      # Pin openregister to development: main lacks the react/async composer dep
      # that lib/Service/ObjectService.php (Async\await call) requires, so app:enable
      # fails with "Call to undefined function React\Async\await()" during seed.
      # ⚠️ The org here is `ConductionNL`, not `Conduction` — the latter does not
      # exist. With the wrong org the checkout prompts for credentials and exits
      # 128, which took out all four PHPUnit legs AND the Playwright job: they
      # had never executed a single test. A `uses:`-grep for the wrong org does
      # NOT find this line, because the org name is embedded in a JSON input
      # rather than a `uses:`. (Fixed concurrently in #671; same value.)
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      # The old seed was `php occ app:disable pipelinq && php occ app:enable
      # pipelinq`. It reported success on every run and provisioned nothing
      # reliable: the repair step it triggers runs with NO user session (OR RBAC
      # can refuse it), swallows its own exception as "Non-fatal", and imports
      # with `force: false` — which can advance the recorded version WITHOUT
      # applying the register. `occ` still exits 0 either way.
      #
      # It also did nothing at all about the real blocker: pipelinq declares a
      # REQUIRED first-time-setup step (reporting currency), and until it is met
      # CnAppRoot REPLACES the entire shell with CnSetupWizard — no <main>, no
      # nav — so all 111 failures were selector timeouts pointing at the wrong
      # thing. The script forces the import, completes setup over the real admin
      # API, and then verifies each of those separately.
      # cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/pipelinq/tests/e2e/ci-seed.sh'

      # Integration Tests (Newman) stays OFF here, deliberately. The
      # `enable-newman: false` further up is not a default nobody chose: it
      # records that tests/newman/pipelinq-api.postman_collection.json does not
      # pass against a freshly-installed Nextcloud because the CRM endpoints
      # need the OpenRegister registers/schemas seeded, and the disable/enable
      # repair cycle alone is not enough. Turning it on would produce a
      # guaranteed red whose cause is already written down.
      #
      # Hydra Gates is likewise NOT touched here — it was switched on in this
      # repo concurrently with this change, already pinned to v1.0.1, and the
      # comment there records that the v1.0.1 package was run locally against
      # the last merged diff first (ALL GATES PASSED, 58 of 61 reporting).

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so these three
      # validators ran nowhere while the run still looked complete. All three
      # are self-contained `node` scripts, which is what a leg has to be.
      # Measured on this tree before enabling: ALL THREE PASS. They are enabled
      # to keep them passing, not because they are currently broken —
      # `check:vue-demi` in particular guards a dual-package hazard that fails
      # silently at runtime rather than at build time.
      # `test:unit` is NOT listed: "Frontend Tests (unit)" already runs it.
      frontend-checks: '["check:manifest", "check:vue-demi", "test:l10n"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 45.36, this repo's own
      # measured coverage (18708 of 41247 statements) read from clover.xml in
      # the `coverage-report` artifact of run 30912733766.
      enable-coverage-guard: true

      # (Hydra Gates is already declared above, pinned to v1.0.1, by the change
      # that enabled it concurrently with this one. Not re-declared here — a
      # duplicate key in a `with:` block is accepted by every YAML parser
      # involved, last-one-wins, and is precisely the kind of thing that reads
      # as configured while being decided somewhere else in the file.)
