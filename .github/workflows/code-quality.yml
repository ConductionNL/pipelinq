name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:
  # Weekly smoke-test cron (pipelinq-quality-phpstan-burndown, Phase 5). A
  # scheduled run always uses the default branch's workflow file and ref
  # (development), so this re-runs the full strict gate suite — phpcs, phpmd,
  # psalm, phpstan (composer check:strict equivalent) plus phpunit — against
  # development once a week to catch drift between PRs. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

# Deduplicate runs per branch. Pushing to an open PR's branch fires both the
# `push` and `pull_request` triggers; `head_ref || ref_name` resolves to the
# same branch name for both, so the two runs share a group and only the newest
# survives. Prevents two full strict-gate suites racing on every push.
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: pipelinq
      # Strict static-analysis gate suite (composer check:strict equivalent).
      # These mirror the shared-workflow defaults (all true) but are pinned
      # here explicitly so the strict-gate posture is self-documenting and
      # cannot regress silently if the shared defaults ever change.
      enable-phpcs: true
      enable-phpmd: true
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-sbom: true
      enable-phpunit: true
      # Newman: tests/newman/pipelinq-api.postman_collection.json doesn't pass
      # against a freshly-installed NC yet — the CRM endpoints need the
      # OpenRegister registers/schemas seeded (the disable/enable repair cycle
      # alone isn't enough). Re-enable once the collection has a working seed
      # path. PHPUnit (the unit suite) runs and is green.
      enable-newman: false
      newman-collection-path: "tests/newman"
      enable-playwright: true
      enable-playwright-coverage: true
      playwright-coverage-threshold: 75
      # Pin openregister to development: main lacks the react/async composer dep
      # that lib/Service/ObjectService.php (Async\await call) requires, so app:enable
      # fails with "Call to undefined function React\Async\await()" during seed.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      playwright-seed-command: 'php occ app:disable pipelinq && php occ app:enable pipelinq'

  # ── Required status check contexts ──────────────────────────────────────────
  #
  # Branch protection requires contexts named exactly "PHP Quality" and
  # "Frontend Quality". The shared workflow's jobs never report under those
  # names: a reusable-workflow call reports one context per inner job, named
  # "<caller-job-id> / <inner-job-name>", and the inner jobs are matrices — so
  # what actually gets posted is "quality / PHP Quality (phpcs)",
  # "quality / Vue Quality (eslint)", and so on. None of those strings equals a
  # required context, so the PR waits forever for statuses nothing will post.
  #
  # These two plain jobs run in this repo, so they report under their own `name`
  # and satisfy the requirement. Adding a tool to the shared matrix changes the
  # inner context names but not these, so the required checks stay stable.
  #
  # Both gate on the same signal — the aggregate result of the whole reusable
  # run. The shared workflow declares no `workflow_call` outputs, so a caller
  # cannot see per-job results; `needs.quality.result` is success only if every
  # non-skipped inner job succeeded. A stylelint failure therefore reds both
  # contexts. Split them once the shared workflow exposes per-area outputs.
  php-quality-gate:
    name: PHP Quality
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report quality suite result
        run: |
          echo "Shared quality result: ${{ needs.quality.result }}"
          [ "${{ needs.quality.result }}" = "success" ] || exit 1

  frontend-quality-gate:
    name: Frontend Quality
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report quality suite result
        run: |
          echo "Shared quality result: ${{ needs.quality.result }}"
          [ "${{ needs.quality.result }}" = "success" ] || exit 1
