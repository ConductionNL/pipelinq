# app-tests-live.yml — pipelinq caller for the LIVE-NC reusable workflow.
#
# Boots a real, seeded Nextcloud (db + NC + openregister deployed/enabled +
# pipelinq deployed/enabled), then runs the deep Playwright e2e
# (tests/e2e/workflows/) and/or the Newman API-contract suite against it as
# HARD gates. Generalised per GAP-2 (arm CI live-gating) from openregister's
# reference rig; the reusable tests-live.yml is byte-identical fleet-wide, only
# these inputs differ. Additive — does not touch app-tests.yml / release /
# pre-merge workflows.
#
# Gate status for pipelinq (see TESTING-CI-ROLLOUT.md for the evidence table):
#   deep-e2e: true  — ARMED: the FixtureSession (tests/e2e/workflows/helpers/fixtures.ts)
#                     resolves the numeric register id from the stable slug 'pipelinq' at
#                     runtime (GET /openregister/api/registers), so the deep suite survives a
#                     fresh CI boot where the re-imported register gets a different id; the
#                     PIPELINQ_REGISTER env var still overrides for manual runs.
#   newman:   true   — ARMED: the collection "0. Setup / Preflight" request resolves the
#                     register numeric id from the stable slug 'pipelinq' and sets {{register}};
#                     POS tender-types is un-quarantined (posTenderType_schema is now mapped on
#                     import) and the OR anon-read authz cases assert the real 404 contract.

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    secrets: inherit
    with:
      app-id: pipelinq
      is-openregister: false
      run-e2e: true
      run-newman: true
      newman-entrypoint: tests/integration/run-newman.sh
