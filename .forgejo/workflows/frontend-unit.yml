# frontend-unit.yml — OFFLINE Vitest gate for pipelinq.
#
# Runs the pure-logic Vitest suite under tests/vitest/** (the dependency-free
# POS total / BTW helpers in src/services/posTotals.js and the BSN 11-proef
# validator in src/services/bsnValidation.js, which mirror the server-
# authoritative PHP formulas). No Nextcloud runtime, no browser. Always gating.
# Additive — does not touch app-tests-live.yml / tests-live.yml /
# pre-merge-check-strict.yaml.

name: frontend-unit

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-unit:
    name: Frontend unit (Vitest — pipelinq)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/ci-node:20
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install npm deps
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Vitest unit suite
        run: npm run test:unit
